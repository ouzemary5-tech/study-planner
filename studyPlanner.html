<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>study planner</title>
    <link rel="stylesheet" href="studyPlanner.css">
</head>
<body>
   
<main>

    <div class="planner-layout">

        <!-- التقويم على اليسار -->
        <aside class="calendar">
            <h2>📅 التقويم</h2>
            <div id="calendar-content"></div>
        </aside>


        <!-- كل محتوى الـStudy Planner في الوسط -->
        <div class="planner-center">

            <h1 id="hello">Study Planner أهلا بك في</h1>

            <p>نظمي مهامك وحققي أهدافك</p>
<div class="digital-clock">  
<div id="clock">00:00:00 </div>

<div id="today-date">
</div>

<div class="task-reminder"></div>
<h3> تذكير المهمة</h3>
<input type="text" id="task-name" placeholder="إسم المهمة">
<input type="time" id="task-time">
<button id="set-reminder"> تعيين النذكير</button>

<p id="reminder-message"></p>
</div>


            <section>

                <div class="add-task">

                    <h2 id="add">إضافة مهمة</h2>

                    <div class="inputs">

                        <div>
                            <label for="task">اسم المهمة</label>
                            <input type="text" id="task">
                        </div>

                        <div>
                            <label for="test">المادة</label>
                            <input type="text" id="test">
                        </div>

                        <div>
                            <label for="time">الوقت</label>
                            <input type="time" id="time">
                        </div>

                    </div>

                    <div id="message"></div>

                    <button class="btn">+ إضافة مهمة</button>

                </div>


                <div id="card">

                    <h2 id="hero">مهامي</h2>

                </div>

            </section>

        </div>


        <!-- العداد على اليمين -->
        <aside class="countdown">

            <h2>⏳ عدادي</h2>

            <div id="countdown-display">
                00:00:00
            </div>

            <div class="countdown-inputs">

                <input type="number" id="hours" min="0" placeholder="س">

                <input type="number" id="minutes" min="0" placeholder="د">

                <input type="number" id="seconds" min="0" placeholder="ث">

            </div>

            <button id="start-timer">ابدأ ✨</button>

            <button id="reset-timer">إعادة</button>

        </aside>

    </div>
    

</main>


<script src="studyPlanner.js"></script>

</body>
</html>
